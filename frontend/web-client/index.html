<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      `viewport-fit=cover` обязателен для портала: без него `env(safe-area-inset-*)`
      на iPhone всегда возвращает 0, и нижний таб-бар заезжает под домашний индикатор
      (см. design/screens/web-client/overview.md п. 3 и 7).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Портал заказчика — CLEANFINE</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
