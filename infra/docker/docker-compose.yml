# CLEANFINE — локальная инфраструктура (dev)
# Использование: docker compose --env-file .env -f infra/docker/docker-compose.yml up -d
# (код по УСТАВ.md → Агент DEVOPS, п.1; healthcheck'и добавлены)
name: cleaning-ops

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cleaning-ops-postgres
    # JIT выключен НАМЕРЕННО. На этом стенде amd64-образ postgres работает под
    # qemu-user (Apple Silicon), и JIT-компиляция читающих запросов отчётов (SQL-view
    # М7.1) идёт в разы медленнее и съедает память процесса:
    #   staff_geofence_totals — jit=off: 9 мс; jit=on: 14,7 с (193 функции LLVM).
    # ВМ colima профиля default — 2 ГиБ без swap, поэтому всплеск заканчивался
    # OOM-kill backend'а: «Server has closed the connection» → 500 у сервисов и
    # падения e2e-наборов (наблюдалось дважды на `--project=web` в М7.3).
    # На настоящем x86 (CI, прод) JIT полезен и правки не требует: CI поднимает
    # postgres сервис-контейнером со своей конфигурацией, а не этим файлом.
    command: ["postgres", "-c", "jit=off"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cleaning_ops}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан в .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Создание БД на сервис при первом старте (см. initdb/01-create-databases.sql).
      # На уже существующем томе не применяется — БД создаются вручную.
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cleaning_ops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cleaning-ops-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cleaning-ops-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан в .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    # Docker Hub-репозиторий minio/minio больше не публикуется (pull access denied);
    # актуальные образы — в quay.io. Тег :latest намеренно оставлен как в уставе.
    image: quay.io/minio/minio:latest
    container_name: cleaning-ops-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      # Root-креды MinIO. Сервисы ходят тем же пользователем через
      # MINIO_ACCESS_KEY/MINIO_SECRET_KEY — значения обязаны совпадать,
      # иначе S3-клиент получает «Access Key Id does not exist».
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER не задан в .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD не задан в .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
