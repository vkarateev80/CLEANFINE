# Catch-all → web-admin (SPA + nginx fanout /api → 9 сервисов).
# TLS: cert-manager после указания Host (домен).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cleaning-ops
  namespace: cleaning-ops
  annotations:
    kubernetes.io/ingress.class: traefik
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port:
                  number: 80
