# cleanfine.ru + www → web-admin (SPA + nginx fanout /api → 9 сервисов).
#
# Роутинг разделён (метод выбран пробами 27.09):
#   * plain Ingress — только TLS-секция для cert-manager и websecure-роутеры;
#     аннотации middleware/tracer в k8s-ingress провайдере traefik 3.7 не
#     применяются (проверено: `middlewares`, `router.middlewares` — молча игнор),
#   * IngressRoute (entryPoints: web, priority 50) — редирект HTTP→HTTPS на
#     всё, кроме ACME: solver-ingress имеет приоритет ~78 по длине правила
#     (PathPrefix /.well-known/acme-challenge/…) и выше — вызов продолжится.
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: cleaning-ops
  labels: { app.kubernetes.io/part-of: cleaning-ops }
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cleaning-ops
  namespace: cleaning-ops
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cleanfine.ru
        - www.cleanfine.ru
      secretName: cleanfine-tls
  rules:
    - host: cleanfine.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port:
                  number: 80
    - host: www.cleanfine.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port:
                  number: 80
---
# HTTP→HTTPS для обоих хостов. priority 50: выше дефолтного (длина правила
# ~40 у plain-Ingress), ниже solver-ингресса (~78) — ACME не перехватывается.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cleanfine-redirect
  namespace: cleaning-ops
  labels: { app.kubernetes.io/part-of: cleaning-ops }
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`cleanfine.ru`) || Host(`www.cleanfine.ru`)
      kind: Rule
      priority: 50
      services:
        - name: web-admin
          port: 80
      middlewares:
        - name: redirect-https
---
# Доступ по IP (http://193.233.193.12/) — smoke и отладка: без TLS и без
# редиректа (на IP у LE-сертификата нет, https сломал бы проверки).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cleaning-ops-ip
  namespace: cleaning-ops
  labels: { app.kubernetes.io/part-of: cleaning-ops }
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-admin
                port:
                  number: 80
