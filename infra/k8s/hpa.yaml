# HPA по CPU для 9 backend-деплоев (М7.5).
# Метрика: средняя загрузка 70% от CPU request (100m → масштаб при >70m).
# min=1 / max=3; на одиночной ноде 4 core 27 реплик в худшем случае не
# влезают — на практике триггерится только реально нагруженный сервис.
# Источник метрик: metrics-server (входит в k3s, `kubectl top` работает).
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth
  namespace: cleaning-ops
  labels: { app.kubernetes.io/part-of: cleaning-ops }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: auth }
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
