apiVersion: v1
kind: Service
metadata:
  name: web-admin
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cleaning-ops
spec:
  selector:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cleaning-ops
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-admin
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: web-admin
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: cleaning-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-admin
      app.kubernetes.io/component: frontend
      app.kubernetes.io/part-of: cleaning-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-admin
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: cleaning-ops
    spec:
      containers:
        - name: web-admin
          image: cleaning-ops/web-admin:latest
          ports:
            - containerPort: 80
          env:
            - name: API_UPSTREAM
              value: "http://auth:3001"
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
