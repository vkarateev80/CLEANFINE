# Шаблон секретов. НЕ заполняйте и не коммитируйте боевые значения:
#   kubectl -n cleaning-ops create secret generic cleaning-ops-secrets …
# или sealed-secrets / external-secrets.
#
# Состав (ключи required для запуска стека):
#   DB_PASSWORD, JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   RABBITMQ_PASSWORD, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
#   MINIO_ACCESS_KEY, MINIO_SECRET_KEY,
#   SERVICE_AUTH_PASSWORD (= пароль фикстуры admin),
#   DATABASE_URL, FILE_DATABASE_URL, CORE_DATABASE_URL, GPS_DATABASE_URL,
#   TICKET_DATABASE_URL, NOTIFICATION_DATABASE_URL, MATERIAL_DATABASE_URL,
#   SCHEDULE_DATABASE_URL, CHAT_DATABASE_URL, RABBITMQ_URL
apiVersion: v1
kind: Secret
metadata:
  name: cleaning-ops-secrets
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/part-of: cleaning-ops
type: Opaque
stringData:
  DB_PASSWORD: "change-me"
  JWT_ACCESS_SECRET: "change-me"
  JWT_REFRESH_SECRET: "change-me"
  RABBITMQ_PASSWORD: "change-me"
  MINIO_ROOT_USER: "cleaning-ops"
  MINIO_ROOT_PASSWORD: "change-me"
  MINIO_ACCESS_KEY: "cleaning-ops"
  MINIO_SECRET_KEY: "change-me"
  SERVICE_AUTH_PASSWORD: "admin123"
  # Web Push (VAPID): пара ключей из `web-push.generateVAPIDKeys()`; пусто — push в браузеры выключен.
  WEB_PUSH_VAPID_PUBLIC_KEY: ""
  WEB_PUSH_VAPID_PRIVATE_KEY: ""
  DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops?schema=public"
  FILE_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_files?schema=public"
  CORE_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_core?schema=public"
  GPS_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_gps?schema=public"
  TICKET_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_tickets?schema=public"
  NOTIFICATION_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_notifications?schema=public"
  MATERIAL_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_materials?schema=public"
  SCHEDULE_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_schedule?schema=public"
  CHAT_DATABASE_URL: "postgresql://admin:change-me@postgres:5432/cleaning_ops_chat?schema=public"
  RABBITMQ_URL: "amqp://admin:change-me@rabbitmq:5672"
