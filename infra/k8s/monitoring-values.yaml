# Значения helm-релиза kube-prometheus-stack (B4, мониторинг k3s).
# Установка (vps2):
#   helm upgrade --install kps prometheus-community/kube-prometheus-stack \
#     -n monitoring --create-namespace -f infra/k8s/monitoring-values.yaml
#
# Секреты НЕ в этом файле — пароль Grafana создаётся отдельно:
#   kubectl -n monitoring create secret generic grafana-admin \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password='<см. память проекта>'
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Доступ: https://cleanfine.ru/grafana/ (ingress — infra/k8s/monitoring.yaml),
  # без смены DNS: path-based на уже выпущенном сертификате cleanfine.ru.
  grafana.ini:
    server:
      root_url: https://cleanfine.ru/grafana/
      serve_from_sub_path: true
  persistence:
    enabled: true
    storageClassName: local-path
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

prometheus:
  prometheusSpec:
    retention: 7d
    resources:
      requests: { cpu: 200m, memory: 512Mi }
      limits: { memory: 1536Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi

alertmanager:
  # Канал алертов (B4): почта на reg.ru → hello@cleanfine.ru.
  # Пароль НЕ здесь: лежит в /root/monitoring-values-secret.yaml на vps2
  # (helm upgrade -f monitoring-values.yaml -f monitoring-values-secret.yaml).
  # SMTP по справке reg.ru: mail.hosting.reg.ru:587 + STARTTLS, логин = адрес ящика.
  config:
    global:
      smtp_smarthost: "mail.hosting.reg.ru:587"
      smtp_from: hello@cleanfine.ru
      smtp_auth_username: hello@cleanfine.ru
      smtp_require_tls: true
    route:
      receiver: email-hello
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      # Демпферы: Watchdog/InfoInhibitor — из дефолтной конфигурации (без них
      # оператор отклоняет конфиг); Kube*Down — шум одиночного k3s (kube-proxy,
      # scheduler, controller-manager живут в процессе k3s, подов нет — алерты
      # никогда не разрешатся и будут письмами каждые 12h.
      routes:
        - receiver: "null"
          matchers:
            - alertname =~ "Watchdog|InfoInhibitor|KubeProxyDown|KubeSchedulerDown|KubeControllerManagerDown"
        # Тревоги CLEANFINE (метка notify=phone, infra/k8s/monitoring.yaml) — push на
        # телефон через свой ntfy (19.10.2026); continue — чтобы ушло и письмо.
        - receiver: phone-ntfy
          matchers:
            - notify = "phone"
          group_wait: 10s
          repeat_interval: 4h
          continue: true
        # После phone-ntfy с continue: письмо получают все остальные (как и раньше).
        - receiver: email-hello
    receivers:
      # Демпфер для подмаршрута Watchdog/InfoInhibitor из дефолтного route:
      # без него оператор отклоняет конфиг (undefined receiver "null").
      - name: "null"
      - name: email-hello
        email_configs:
          - to: hello@cleanfine.ru
            send_resolved: true
      # Push через ntfy (cleaning-ops/ntfy). Адрес с секретным топиком и русским
      # шаблоном сообщения — в Secret monitoring/alertmanager-ntfy (ключ url),
      # создаёт infra/grafana/apply.sh; на телефоне — подписка в приложении ntfy.
      - name: phone-ntfy
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/url
            send_resolved: true
  alertmanagerSpec:
    retention: 168h # формат AM только h/m/s (не «7d»)
    # Чарт кладёт alertmanager.config в Secret alertmanager-<crname>, но без
    # configSecret оператор монтирует свой дефолтный -generated (receiver: null).
    # Указываем явно — helm-секрет с SMTP становится источником конфига.
    configSecret: alertmanager-kps-kube-prometheus-stack-alertmanager
    # Монтируется в /etc/alertmanager/secrets/alertmanager-ntfy/ (url_file выше).
    secrets:
      - alertmanager-ntfy
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { memory: 128Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests:
              storage: 1Gi

# node-exporter/kube-state-metrics — дефолты стека (диск, CPU, поды).
# Доска действийы по умолчанию включены (node-exporter full).
defaultRules:
  rules:
    alertmanager: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
