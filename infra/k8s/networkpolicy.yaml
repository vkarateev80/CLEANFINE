# Базовая изоляция: к БД/брокеру/MinIO — только своё namespace.
# Для ingress→frontend и frontend→backend нужен доп. policy; на многих
# кластерах default-допуск пока не включён — включите вручную:
#   kubectl -n cleaning-ops apply -f networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-data-plane
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/part-of: cleaning-ops
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
