apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: cleaning-ops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: cleaning-ops
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: cleaning-ops
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/part-of: cleaning-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: cleaning-ops
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: cleaning-ops-secrets, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: cleaning-ops-secrets, key: MINIO_ROOT_PASSWORD }
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 10
            # 1 с не хватало при сборке образов на хосте — проба таймаутила (14.10.2026).
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: cleaning-ops
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 10Gi }
