apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cleaning-ops
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cleaning-ops
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cleaning-ops
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/part-of: cleaning-ops
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: cleaning-ops
    spec:
      containers:
        - name: postgres
          image: postgis/postgis:16-3.4
          args: ["postgres", "-c", "jit=off"]
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: cleaning-ops-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: cleaning-ops-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: cleaning-ops-secrets, key: DB_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "2Gi" }
          # Таймауты проб (14.10.2026): с дефолтным timeoutSeconds=1 pg_isready не
          # успевал ответить во время сборки docker-образов на этом же хосте
          # (I/O-стопор), kubelet три раза подряд считал базу мёртвой и
          # перезапускал её вместе со всеми зависимыми сервисами (12.10, 14.10).
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "admin", "-d", "cleaning_ops"] }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "admin", "-d", "cleaning_ops"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: cleaning-ops
data:
  01-create-databases.sql: |
    CREATE DATABASE cleaning_ops_files;
    CREATE DATABASE cleaning_ops_core;
    CREATE DATABASE cleaning_ops_gps;
    CREATE DATABASE cleaning_ops_tickets;
    CREATE DATABASE cleaning_ops_notifications;
    CREATE DATABASE cleaning_ops_materials;
    CREATE DATABASE cleaning_ops_schedule;
    CREATE DATABASE cleaning_ops_chat;
    \connect cleaning_ops_gps
    CREATE EXTENSION IF NOT EXISTS postgis;
    \connect cleaning_ops_core
    CREATE EXTENSION IF NOT EXISTS postgis;
    \connect cleaning_ops_tickets
    CREATE EXTENSION IF NOT EXISTS postgis;
    \connect cleaning_ops_notifications
    CREATE EXTENSION IF NOT EXISTS postgis;
    \connect cleaning_ops_files
    CREATE EXTENSION IF NOT EXISTS postgis;
    \connect cleaning_ops_materials
    CREATE EXTENSION IF NOT EXISTS postgis;
    \connect cleaning_ops_schedule
    CREATE EXTENSION IF NOT EXISTS postgis;
