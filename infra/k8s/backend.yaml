# 9 бэкенд-сервисов. Образы: cleaning-ops/<name>:<tag> (подставьте registry и tag).
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cleaning-ops
spec:
  selector:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cleaning-ops
  ports:
    - name: http
      port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: cleaning-ops
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cleaning-ops
spec:
  replicas: 1
  selector:
    matchLabels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cleaning-ops
  template:
    metadata:
      labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: cleaning-ops
    spec:
      containers:
        - name: auth
          image: cleaning-ops/auth:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: cleaning-ops-config }
            - secretRef: { name: cleaning-ops-secrets }
          env:
            - name: PORT
              value: "3001"
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "320Mi" }
          readinessProbe:
            httpGet: { path: /api/docs, port: 3001 }
---
