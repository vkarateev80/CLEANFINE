# cleanfine.ru → backend k3s на 193.233.193.12 (M7.5, вариант B)
#
# Где применить: панель reg.ru (reg108 / 37.140.192.67) или
# /etc/nginx/conf.d/cleanfine.ru.conf на reg108, затем `nginx -t && reload`.
#
# Статику админки/портала можно оставить на reg108 (root) ИЛИ проксировать
# всё на k3s (ниже — полный прокси: admin + API + portal через path).
# Рекомендуемый вариант — полный прокси: один источник правды.

server {
    listen 80;
    listen [::]:80;
    server_name cleanfine.ru www.cleanfine.ru;

    # Загрузка фото/планов через file-service
    client_max_body_size 25m;

    # WebSocket /chat
    location /socket.io/ {
        proxy_pass http://193.233.193.12:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://193.233.193.12:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
