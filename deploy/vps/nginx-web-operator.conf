# ============================================================
# web-operator: nginx + SPA + reverse-proxy — рабочее место оператора
# (cleanfine.ru/app). Решение владельца 09.10.2026: веб вместо нативных сборок.
#
# Маршрутизация снята с frontend/web-operator/vite.config.ts (SERVICE_ROUTES):
# оператору нужны все сервисы, кроме materials (списание делает сервер).
# На k3s traefik срезает префикс /app (см. infra/k8s/ingress.yaml), поэтому
# внутри пода статика живёт в корне, а `base` сборки — /app/.
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Фото операций/SOS ≤10 МБ (file-service) + multipart-обвязка.
    client_max_body_size 25m;

    location /api/auth          { proxy_pass http://auth:3001;          include /etc/nginx/proxy_params; }
    location /api/users         { proxy_pass http://auth:3001;          include /etc/nginx/proxy_params; }
    location /api/files         { proxy_pass http://files:3002;         include /etc/nginx/proxy_params; }
    location /api/objects       { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/floors        { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/rooms         { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/routes        { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/tech-cards    { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/gps           { proxy_pass http://gps:3004;           include /etc/nginx/proxy_params; }
    location /api/tickets       { proxy_pass http://tickets:3005;       include /etc/nginx/proxy_params; }
    location /api/notifications { proxy_pass http://notifications:3006; include /etc/nginx/proxy_params; }
    location /api/schedule      { proxy_pass http://schedule:3008;      include /etc/nginx/proxy_params; }
    location /api/chat          { proxy_pass http://chat:3009;          include /etc/nginx/proxy_params; }

    location /socket.io/ {
        proxy_pass http://chat:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://auth:3001;
        include /etc/nginx/proxy_params;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html, service worker и манифест — без кэша: иначе после выката
    # телефон неделю держит старую оболочку.
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /sw.js { add_header Cache-Control "no-store"; add_header Service-Worker-Allowed "/"; }
    location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-store"; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
