# ============================================================
# web-client: nginx + SPA + reverse-proxy (System Design v2, §4.2, FR-5).
#
# Маршрутизация снята ТОЧНО с frontend/web-client/vite.config.ts (SERVICE_ROUTES).
#
# Отличия от админки — сознательные и унаследованы из dev-конфига:
#   * порталу нужны только auth/users, core (объект клиента), tickets,
#     notifications, materials, schedule и chat;
#   * /api/files и /api/gps НЕ объявлены: такие пути честно уходят в catch-all
#     /api/ → auth:3001 и получают 404 — это зеркалит поведение dev-прокси Vite
#     («честный 404» вместо ответа чужого сервиса);
#   * WebSocket-шлюз идёт через тот же /socket.io/ → chat:3009.
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60m;

    # Сжатие: бандл 430 КБ без gzip шёл 5–10 с на мобильной сети (замер 09.10);
    # дефолтный nginx:alpine gzip не включает.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff2;

    # --- API: точная карта из vite.config.ts -------------------------------
    location /api/auth          { proxy_pass http://auth:3001;          include /etc/nginx/proxy_params; }
    location /api/users         { proxy_pass http://auth:3001;          include /etc/nginx/proxy_params; }
    location /api/objects       { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/tickets       { proxy_pass http://tickets:3005;       include /etc/nginx/proxy_params; }
    location /api/notifications { proxy_pass http://notifications:3006; include /etc/nginx/proxy_params; }
    location /api/materials     { proxy_pass http://materials:3007;     include /etc/nginx/proxy_params; }
    location /api/schedule      { proxy_pass http://schedule:3008;      include /etc/nginx/proxy_params; }
    location /api/chat          { proxy_pass http://chat:3009;          include /etc/nginx/proxy_params; }

    # --- WebSocket-шлюз (socket.io) ---------------------------------------
    location /socket.io/ {
        proxy_pass http://chat:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Catch-all: /api/files и /api/gps попадают сюда ⇒ 404 от auth -----
    location /api/ {
        proxy_pass http://auth:3001;
        include /etc/nginx/proxy_params;
    }

    # --- Статика SPA -------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
