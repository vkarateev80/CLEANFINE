# ============================================================
# web-admin: nginx + SPA + reverse-proxy (System Design v2, §4.1, FR-5).
#
# Маршрутизация снята ТОЧНО с frontend/web-admin/vite.config.ts (SERVICE_ROUTES).
# Префиксное сопоставление nginx выбирает самый длинный префикс, поэтому явные
# /api/<svc> выигрывают у catch-all /api/ — порядок location в файле на это не
# влияет, но для читаемости они идут от частного к общему.
#
# Порты назначения — АКТУАЛЬНЫЕ (files 3002, core 3003, tickets 3005,
# notifications 3006), не из устаревшего /opt-стенда (FR-3).
# ============================================================
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка планов этажей/фото идёт через core/file; file-service ограничивает
    # файл 10 МБ, 25m даёт запас на multipart-обвязку (§4).
    client_max_body_size 60m;

    # Сжатие: бандл 430 КБ без gzip шёл 5–10 с на мобильной сети (замер 09.10);
    # дефолтный nginx:alpine gzip не включает.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml font/woff2;

    # --- API: точная карта из vite.config.ts -------------------------------
    location /api/auth          { proxy_pass http://auth:3001;          include /etc/nginx/proxy_params; }
    location /api/users         { proxy_pass http://auth:3001;          include /etc/nginx/proxy_params; }
    location /api/files         { proxy_pass http://files:3002;         include /etc/nginx/proxy_params; }
    location /api/objects       { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/floors        { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/rooms         { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/routes        { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/route-points  { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/tech-cards    { proxy_pass http://core:3003;          include /etc/nginx/proxy_params; }
    location /api/tech-operations { proxy_pass http://core:3003;        include /etc/nginx/proxy_params; }
    location /api/gps           { proxy_pass http://gps:3004;           include /etc/nginx/proxy_params; }
    location /api/tickets       { proxy_pass http://tickets:3005;       include /etc/nginx/proxy_params; }
    location /api/notifications { proxy_pass http://notifications:3006; include /etc/nginx/proxy_params; }
    location /api/materials     { proxy_pass http://materials:3007;     include /etc/nginx/proxy_params; }
    location /api/schedule      { proxy_pass http://schedule:3008;      include /etc/nginx/proxy_params; }
    location /api/chat          { proxy_pass http://chat:3009;          include /etc/nginx/proxy_params; }

    # --- WebSocket-шлюз (socket.io) ---------------------------------------
    # В проде апгрейд делает именно nginx: клиент уходит на same-origin
    # /socket.io (VITE_WS_URL не задаётся, см. FR-4).
    location /socket.io/ {
        proxy_pass http://chat:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Долгоживущее соединение: обрыв по таймауту ломал бы чат.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --- Catch-all: неизвестный /api/* отдаёт auth (как в dev-прокси) ------
    location /api/ {
        proxy_pass http://auth:3001;
        include /etc/nginx/proxy_params;
    }

    # --- Статика SPA -------------------------------------------------------
    # Хэшированные ассеты Vite: имя файла меняется при изменении содержимого,
    # поэтому кэш можно держать долго и иммутабельно.
    # Service worker админки (Web Push, 12.10.2026): всегда свежий, scope "/".
    location = /sw.js { add_header Cache-Control "no-store"; add_header Service-Worker-Allowed "/"; }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html кэшировать нельзя: иначе после redeploy браузер держит старую
    # ссылку на удалённые ассеты.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html (react-router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
