plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Ключ релизной подписи Android лежит ВНЕ репозитория (android/key.properties в .gitignore,
// сам .jks — в ~/.cleaning-ops/android/). Если файла нет (CI, чужое окружение), release
// собирается debug-ключом — как было раньше, чтобы сборка не падала.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.cleaningops.cleaning_ops_app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        // flutter_local_notifications требует core library desugaring (AAR metadata).
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.cleaningops.cleaning_ops_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Релиз подписывается ключом из android/key.properties (вне git).
            // Без файла — debug-ключом, чтобы `flutter build apk --release` работал и в CI.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Продукты (lib/core/app_product.dart): один код — два приложения с разными
    // applicationId, именами и точками входа. Сборка ОБЯЗАНА указывать flavor:
    //   flutter build apk --flavor operator -t lib/main_operator.dart
    //   flutter build apk --flavor team     -t lib/main_team.dart
    //   flutter build apk --flavor client   -t lib/main_client.dart
    //   flutter build apk --flavor admin    -t lib/main_admin.dart
    // `operator` сохраняет исторический applicationId — установленное приложение
    // обновляется, а не ставится рядом.
    flavorDimensions "product"
    productFlavors {
        operator {
            dimension "product"
            applicationId "com.cleaningops.cleaning_ops_app"
            resValue "string", "app_name", "CLEANFINE Оператор"
        }
        team {
            dimension "product"
            applicationId "com.cleaningops.team"
            resValue "string", "app_name", "CLEANFINE Команда"
        }
        client {
            dimension "product"
            applicationId "com.cleaningops.client"
            resValue "string", "app_name", "CLEANFINE Клиент"
        }
        admin {
            dimension "product"
            applicationId "com.cleaningops.admin"
            resValue "string", "app_name", "CLEANFINE Админ"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // NotificationCompat/ServiceCompat для фоновой связи (CfPushService).
    implementation 'androidx.core:core:1.13.1'
}
