name: CI

# Cleaning Ops — базовый CI (М0.6; расширен М2.9: file/core; М3: gps/tickets/notifications).
# Прогоняется на PR в develop/main и на пушах. Сервисы backend/* подключаются
# автоматически по мере появления (в директории должен быть package.json).
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    name: Lint, types, unit (backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cleaning_ops_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d cleaning_ops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      FILE_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      CORE_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      GPS_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      TICKET_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      NOTIFICATION_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      MATERIAL_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      SCHEDULE_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      CHAT_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_test?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Format check (root)
        run: pnpm format:check

      - name: Typecheck shared contracts
        run: pnpm --filter @cleaning-ops/shared typecheck

      # Backend/frontend резолвят @cleaning-ops/shared/* через shared/dist
      # (tsconfig paths) — без сборки контрактов они не соберутся.
      - name: Build shared contracts
        run: pnpm --filter @cleaning-ops/shared build

      # pnpm дедуплицирует @prisma/client в один каталог .pnpm, поэтому
      # `prisma generate` для девяти схем перезаписывает один и тот же клиент:
      # побеждал последний сервис, и auth-service собирался с моделями
      # ticket-service. Скрипт генерирует клиент каждому сервису и переносит его
      # копию в node_modules самого сервиса, а затем проверяет, что модели
      # клиента совпадают со схемой (см. scripts/ci/prisma-clients.mjs).
      - name: Prisma generate (клиент каждому сервису)
        run: node scripts/ci/prisma-clients.mjs

      - name: Lint + build + typecheck + unit tests for existing backend services
        shell: bash
        run: |
          set -euo pipefail
          for dir in backend/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "== $dir =="
              (cd "$dir" && pnpm lint && pnpm build && pnpm typecheck && pnpm test)
            fi
          done

      # Фронтенды в этой джобе не собирались вообще: ошибка типов в web-admin
      # или в портале всплывала только на шаге e2e или не всплывала совсем.
      # Тесты: у web-admin есть vitest (web-client пока без test-скрипта —
      # --if-present его пропускает).
      - name: Typecheck + build + test frontends (web-admin, web-client)
        shell: bash
        run: |
          set -euo pipefail
          for dir in frontend/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "== $dir =="
              (cd "$dir" && pnpm typecheck && pnpm build && pnpm test --if-present)
            fi
          done

  mobile:
    # Мобильное приложение (М6) проверяется отдельной джобой: у него свой SDK.
    # Сборка APK/IPA здесь не делается — на раннере нет Android SDK/Xcode, а
    # приёмка М6.0/М6.8 требует именно `flutter analyze` и `flutter test`.
    name: Mobile (flutter analyze + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # Дизайн-токены лежат в design/tokens/generated и подключены path-зависимостью
      # (`cleaning_ops_tokens`), поэтому подкаталог уже в чекауте — ничего копировать не надо.
      - name: Install dependencies
        working-directory: mobile/cleaning-ops-app
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/cleaning-ops-app
        run: flutter analyze

      - name: Tests
        working-directory: mobile/cleaning-ops-app
        run: flutter test

  e2e:
    name: E2E (auth + files + core + gps + tickets + notifications + materials + schedule + chat, web-admin и портал)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: quality

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: cleaning_ops_e2e
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d cleaning_ops_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        # Нужен М3: ticket/gps публикуют события, notification их потребляет
        # (SOS-вертикаль). Без брокера сервисы всё равно поднимаются (lazy-retry),
        # но сценарии уведомлений не проверяются.
        image: rabbitmq:3-alpine
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_e2e?schema=public
      FILE_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_files?schema=public
      CORE_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_core?schema=public
      GPS_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_gps?schema=public
      TICKET_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_tickets?schema=public
      NOTIFICATION_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_notifications?schema=public
      MATERIAL_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_materials?schema=public
      SCHEDULE_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_schedule?schema=public
      CHAT_DATABASE_URL: postgresql://admin:password@localhost:5432/cleaning_ops_chat?schema=public
      RABBITMQ_URL: amqp://admin:password@localhost:5672
      GPS_SERVICE_URL: http://localhost:3004
      CORE_SERVICE_URL: http://localhost:3003
      TICKET_SERVICE_URL: http://localhost:3005
      # chat-service → notification-service: push оффлайн-получателям (М5.1).
      NOTIFICATION_SERVICE_URL: http://localhost:3006
      # Сервисная учётка для внутренних вызовов (material → core, schedule → ticket/gps).
      SERVICE_AUTH_EMAIL: admin@cleaning-ops.com
      SERVICE_AUTH_PASSWORD: admin123
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      # Логин ограничен 5/мин — набор делает больше попыток, лимит поднимаем.
      # Механизм 429 проверяется отдельным тестом локально (E2E_RATE_LIMIT=1).
      THROTTLE_LOGIN_LIMIT: '1000'
      THROTTLE_GLOBAL_LIMIT: '10000'
      # MinIO: root-креды сервера и S3-креды сервисов обязаны совпадать,
      # иначе «Access Key Id does not exist» (см. .env.example).
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ci-minio-secret-2024
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: ci-minio-secret-2024
      MINIO_PUBLIC_URL: http://localhost:9000
      FILE_SERVICE_URL: http://localhost:3002
      E2E_API_URL: http://localhost:3001
      E2E_CORE_URL: http://localhost:3003
      E2E_FILE_URL: http://localhost:3002
      E2E_GPS_URL: http://localhost:3004
      E2E_TICKET_URL: http://localhost:3005
      E2E_NOTIFICATION_URL: http://localhost:3006
      E2E_MATERIAL_URL: http://localhost:3007
      E2E_SCHEDULE_URL: http://localhost:3008
      E2E_CHAT_URL: http://localhost:3009
      E2E_BASE_URL: http://localhost:5173
      E2E_PORTAL_URL: http://localhost:5174
      # Периодические проходы schedule-service в e2e выключены: набор проверяет
      # те же действия через детерминированные триггеры (POST /generate,
      # POST /check-missed). Фоновый проход неявок раз в 5 минут переводил бы
      # смены в MISSED прямо во время прогона и делал ожидания невоспроизводимыми.
      SCHEDULE_CRON_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install
        run: pnpm install --no-frozen-lockfile

      # Backend и web-admin резолвят @cleaning-ops/shared/* через shared/dist
      - name: Build shared contracts
        run: pnpm --filter @cleaning-ops/shared build

      # MinIO запускается НЕ как service-контейнер: GitHub Actions не позволяет
      # переопределить команду сервиса, а у образа quay.io/minio/minio:latest
      # CMD=["minio"] без аргументов — контейнер печатает usage и сразу выходит
      # (job падает на старте сервиса). Тот же образ поднимаем через docker run.
      # quay.io — потому что репозиторий minio/minio на Docker Hub удалён.
      - name: Start MinIO (S3 для file-service)
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER="$MINIO_ROOT_USER" \
            -e MINIO_ROOT_PASSWORD="$MINIO_ROOT_PASSWORD" \
            quay.io/minio/minio:latest server /data --console-address ":9001"
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:9000/minio/health/live; then
              echo "MinIO готов"
              exit 0
            fi
            sleep 1
          done
          echo "MinIO не поднялся"
          docker logs minio || true
          exit 1

      # Сервис-контейнер postgres создаёт только cleaning_ops_e2e; у остальных
      # сервисов свои БД (границы микросервисов: своя схема на сервис).
      - name: Create databases (files, core, gps, tickets, notifications, materials, schedule, chat)
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U admin -d cleaning_ops_e2e -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE cleaning_ops_files;' \
            -c 'CREATE DATABASE cleaning_ops_core;' \
            -c 'CREATE DATABASE cleaning_ops_gps;' \
            -c 'CREATE DATABASE cleaning_ops_tickets;' \
            -c 'CREATE DATABASE cleaning_ops_notifications;' \
            -c 'CREATE DATABASE cleaning_ops_materials;' \
            -c 'CREATE DATABASE cleaning_ops_schedule;' \
            -c 'CREATE DATABASE cleaning_ops_chat;'

      - name: Prisma generate (клиент каждому сервису) + migrate deploy
        run: |
          node scripts/ci/prisma-clients.mjs
          pnpm --filter @cleaning-ops/auth-service prisma:deploy
          pnpm --filter @cleaning-ops/file-service prisma:deploy
          pnpm --filter @cleaning-ops/core-service prisma:deploy
          pnpm --filter @cleaning-ops/gps-service prisma:deploy
          pnpm --filter @cleaning-ops/ticket-service prisma:deploy
          pnpm --filter @cleaning-ops/notification-service prisma:deploy
          pnpm --filter @cleaning-ops/material-service prisma:deploy
          pnpm --filter @cleaning-ops/schedule-service prisma:deploy
          pnpm --filter @cleaning-ops/chat-service prisma:deploy

      # PostGIS-расширение нужно БД gps (в postgis-образе оно есть только в
      # POSTGRES_DB, для остальных БД создаётся явно).
      - name: Enable PostGIS in gps database
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U admin -d cleaning_ops_gps -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS postgis;'

      - name: Seed users
        run: node scripts/seed/seed-users.mjs

      - name: Build services (auth, file, core, gps, ticket, notification, material, schedule)
        run: |
          pnpm --filter @cleaning-ops/auth-service build
          pnpm --filter @cleaning-ops/file-service build
          pnpm --filter @cleaning-ops/core-service build
          pnpm --filter @cleaning-ops/gps-service build
          pnpm --filter @cleaning-ops/ticket-service build
          pnpm --filter @cleaning-ops/notification-service build
          pnpm --filter @cleaning-ops/material-service build
          pnpm --filter @cleaning-ops/schedule-service build
          pnpm --filter @cleaning-ops/chat-service build

      # Примерка готовности: /api/auth/me отвечает 401 без токена — это признак
      # живого сервиса, поэтому проверяем код ответа, а не успех запроса.
      - name: Start auth-service (3001)
        working-directory: backend/auth-service
        run: |
          nohup node dist/main.js > /tmp/auth-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api/auth/me || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "auth-service не поднялся"; tail -n 100 /tmp/auth-service.log || true; exit 1
          fi
          echo "auth-service готов"

      # /api/files/health/ping — собственный health file-service (200 и при
      # недоступном MinIO: проверяется живость сервиса, а не S3).
      - name: Start file-service (3002)
        working-directory: backend/file-service
        run: |
          nohup node dist/main.js > /tmp/file-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/api/files/health/ping || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "file-service не поднялся"; tail -n 100 /tmp/file-service.log || true; exit 1
          fi
          echo "file-service готов"

      # У core-service собственного health-эндпоинта нет: глобальный JwtAuthGuard
      # отвечает 401 на защищённый ресурс — этого достаточно как признак жизни.
      - name: Start core-service (3003)
        working-directory: backend/core-service
        run: |
          nohup node dist/main.js > /tmp/core-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3003/api/objects || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "core-service не поднялся"; tail -n 100 /tmp/core-service.log || true; exit 1
          fi
          echo "core-service готов"

      - name: Start gps-service (3004)
        working-directory: backend/gps-service
        run: |
          nohup node dist/main.js > /tmp/gps-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3004/api/gps/tracks || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "gps-service не поднялся"; tail -n 100 /tmp/gps-service.log || true; exit 1
          fi
          echo "gps-service готов"

      - name: Start ticket-service (3005)
        working-directory: backend/ticket-service
        run: |
          nohup node dist/main.js > /tmp/ticket-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3005/api/tickets || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "ticket-service не поднялся"; tail -n 100 /tmp/ticket-service.log || true; exit 1
          fi
          echo "ticket-service готов"

      - name: Start notification-service (3006)
        working-directory: backend/notification-service
        run: |
          nohup node dist/main.js > /tmp/notification-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3006/api/notifications || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "notification-service не поднялся"; tail -n 100 /tmp/notification-service.log || true; exit 1
          fi
          echo "notification-service готов"

      - name: Start material-service (3007)
        working-directory: backend/material-service
        run: |
          nohup node dist/main.js > /tmp/material-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3007/api/materials || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "material-service не поднялся"; tail -n 100 /tmp/material-service.log || true; exit 1
          fi
          echo "material-service готов"

      - name: Start schedule-service (3008)
        working-directory: backend/schedule-service
        run: |
          nohup node dist/main.js > /tmp/schedule-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3008/api/schedule || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "schedule-service не поднялся"; tail -n 100 /tmp/schedule-service.log || true; exit 1
          fi
          echo "schedule-service готов"

      - name: Start chat-service (3009)
        working-directory: backend/chat-service
        run: |
          nohup node dist/main.js > /tmp/chat-service.log 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3009/api/chat/chats || true)
            if [ "$code" = "401" ]; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "chat-service не поднялся"; tail -n 100 /tmp/chat-service.log || true; exit 1
          fi
          echo "chat-service готов"

      - name: Install Playwright browsers
        working-directory: test
        run: pnpm exec playwright install --with-deps chromium

      - name: Start web-admin
        working-directory: frontend/web-admin
        run: |
          nohup node node_modules/vite/bin/vite.js --port 5173 --strictPort > /tmp/web-admin.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5173/login; then break; fi
            sleep 1
          done

      # Портал заказчика (М5.4) — отдельное приложение на 5174; его UI-наборы
      # читают E2E_PORTAL_URL.
      - name: Start web-client (портал)
        working-directory: frontend/web-client
        run: |
          nohup node node_modules/vite/bin/vite.js --port 5174 --strictPort > /tmp/web-client.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:5174/login; then break; fi
            sleep 1
          done

      # E2E_CORE_URL/E2E_FILE_URL читают e2e-тесты ядра и файлов (test/e2e/api).
      - name: Run e2e (API + UI)
        working-directory: test
        # Уборка и SQL-проверки e2e-наборов идут через `docker exec <container> psql`.
        # В CI postgres — service-контейнер со сгенерированным именем, поэтому
        # хелперы (E2E_POSTGRES_CONTAINER) получают его id. Контекст `job` доступен
        # только в ключах шага, не в env джобы, поэтому переменная задана здесь:
        # без неё sqlAvailable() возвращал false и шесть тестов молча скипались.
        env:
          E2E_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test/reports/playwright
          retention-days: 7

      - name: Service logs on failure
        if: failure()
        run: |
          mkdir -p service-logs
          for name in auth-service file-service core-service gps-service ticket-service notification-service material-service schedule-service chat-service web-admin web-client; do
            echo "=== $name ==="
            tail -n 100 "/tmp/$name.log" || true
            cp "/tmp/$name.log" "service-logs/$name.log" 2>/dev/null || true
          done
          echo "=== minio ==="
          docker logs minio > service-logs/minio.log 2>&1 || true
          tail -n 100 service-logs/minio.log || true

      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: service-logs/
          retention-days: 7
          if-no-files-found: ignore
